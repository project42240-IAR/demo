[project]
name = "fake-social-media-detection"
version = "0.1.0"
description = "AI-assisted fake social media account detection and reporting system"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pymongo",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.vercel]
entrypoint = "api.index:app"
