[project]
name = "fake-social-media-detection"
version = "0.1.0"
description = "Fake Social Media Account Detection and Reporting System"
requires-python = ">=3.12"
dependencies = [
	"Flask>=3.0.0",
	"scikit-learn>=1.5.0",
	"pandas>=2.2.0",
	"numpy>=1.26.0",
	"joblib>=1.4.0",
	"supabase>=2.0.0",
	"cryptography>=42.0.0",
	"python-dotenv>=1.0.0",
	"requests>=2.32.0",
	"beautifulsoup4>=4.12.0",
	"web3>=6.15.0",
]

[tool.vercel]
entrypoint = "wsgi:app"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
